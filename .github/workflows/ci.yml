name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.0.4
      - run: pi --version
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: redharness validate benchmarks/examples/hello/task.yaml
      - run: redharness validate benchmarks/examples/hello-docker-verifier/task.yaml
      - run: redharness validate-suite benchmarks/examples/smoke-suite.yaml
      - run: python -c "from redharness.models import load_agent; a=load_agent('agents/examples/pi.yaml'); assert a.type == 'pi'"
      - run: python -c "from redharness.models import load_agent; a=load_agent('agents/examples/pi-tsec.yaml'); assert a.type == 'pi' and a.network == 'host'"
      - run: redharness tsec --help
      - run: redharness gateway --help
      - run: redharness serve --help
      - run: redharness worker --help
      - run: redharness capabilities
      - run: redharness run benchmarks/examples/hello/task.yaml --agent agents/examples/demo.yaml --allow-host-agent --seed 7
      - run: >-
          redharness suite benchmarks/examples/smoke-suite.yaml
          --agent agents/examples/demo.yaml
          --allow-host-agent
          --workers 2
      - run: >-
          redharness run benchmarks/examples/hello/task.yaml
          --agent agents/examples/gateway-demo.yaml
          --allow-host-agent
          --gateway
          --gateway-policy examples/gateway-policy.yaml
          --seed 11
      - run: docker build -t redharness-gateway-demo:ci agents/examples/docker-gateway
      - run: docker build -t redharness-verifier:ci benchmarks/examples/hello-docker-verifier
      - run: docker build -f docker/gateway/Dockerfile -t redharness-gateway:ci .
      - run: >-
          redharness run benchmarks/examples/hello/task.yaml
          --agent agents/examples/docker-gateway.yaml
          --gateway
          --gateway-policy examples/gateway-policy.yaml
          --seed 12
      - run: >-
          redharness run benchmarks/examples/hello/task.yaml
          --agent agents/examples/docker-gateway.yaml
          --gateway
          --gateway-mode sidecar
          --gateway-image redharness-gateway:ci
          --gateway-policy examples/gateway-policy.yaml
          --seed 14
      - run: >-
          redharness run benchmarks/examples/hello-docker-verifier/task.yaml
          --agent agents/examples/demo.yaml
          --allow-host-agent
          --seed 13
      - name: distributed control plane and worker e2e
        env:
          REDHARNESS_CONTROL_TOKEN: ci-token
        run: |
          set -euo pipefail
          rm -rf .redharness/distributed-runs
          rm -f /tmp/redharness-control.db
          redharness serve \
            --queue-db /tmp/redharness-control.db \
            --runs-root .redharness/distributed-runs \
            --benchmarks-root benchmarks \
            --host 127.0.0.1 \
            --port 8780 >/tmp/redharness-control.log 2>&1 &
          control_pid=$!
          trap 'kill "$control_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import httpx

          for _ in range(100):
              try:
                  if httpx.get("http://127.0.0.1:8780/health", timeout=0.5).status_code == 200:
                      break
              except Exception:
                  pass
              time.sleep(0.1)
          else:
              raise SystemExit("control plane failed to start")
          PY
          redharness submit benchmarks/examples/hello/task.yaml \
            --agent agents/examples/demo.yaml \
            --control-url http://127.0.0.1:8780 \
            --runs-root .redharness/distributed-runs \
            --allow-host-agent \
            --seed 21 >/tmp/submitted-job.json
          redharness worker \
            --control-url http://127.0.0.1:8780 \
            --workspace-root . \
            --allow-host-jobs \
            --once
          python - <<'PY'
          import httpx

          headers = {"Authorization": "Bearer ci-token"}
          jobs = httpx.get(
              "http://127.0.0.1:8780/v1/jobs", headers=headers, timeout=5
          ).json()
          assert len(jobs) == 1, jobs
          assert jobs[0]["state"] == "completed", jobs[0]
          assert jobs[0]["result"]["success"] is True, jobs[0]
          board = httpx.get(
              "http://127.0.0.1:8780/v1/leaderboard", headers=headers, timeout=5
          ).json()
          assert board[0]["success_rate"] == 1.0, board
          assert board[0]["mean_score"] == 100.0, board
          run_id = jobs[0]["result"]["run_id"]
          trace = httpx.get(
              f"http://127.0.0.1:8780/v1/runs/{run_id}/trace",
              headers=headers,
              timeout=5,
          ).json()
          assert trace, trace
          otel = httpx.get(
              f"http://127.0.0.1:8780/v1/runs/{run_id}/otel",
              headers=headers,
              timeout=5,
          ).json()
          assert otel["resourceSpans"], otel
          PY
