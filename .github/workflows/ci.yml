name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install Python verifier sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.0.4
      - run: pi --version
      - run: python -m pip install -e ".[dev]"
      - name: enforce harness namespace
        run: |
          python - <<'PY'
          from pathlib import Path

          forbidden = (
              "redharness",
              "REDHARNESS_",
              ".redharness",
              "rh_pi_",
              '"harness.world/',
              '"harness.progress/',
          )
          violations = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path == Path(".github/workflows/ci.yml"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in forbidden:
                  if token in text:
                      violations.append(f"{path}: {token}")
          if violations:
              raise SystemExit(
                  "legacy or non-standard harness namespace detected:\n"
                  + "\n".join(violations)
              )
          PY
      - run: ruff check .
      - run: docker build -t harness-isolation-probe:ci agents/examples/isolation-probe
      - run: docker build -t harness-pi-rpc-resume-probe:ci agents/examples/pi-rpc-resume-probe
      - run: docker build -t harness/pi-kali:ci docker/pi-kali
      - run: pytest -q
      - run: harness validate benchmarks/examples/hello/task.yaml
      - run: harness preflight benchmarks/examples/hello/task.yaml --agent agents/examples/demo.yaml
      - run: harness validate benchmarks/examples/hello-docker-verifier/task.yaml
      - run: harness validate-suite benchmarks/examples/smoke-suite.yaml
      - run: python -c "from harness.models import load_agent; a=load_agent('agents/examples/pi.yaml'); assert a.type == 'pi'"
      - run: python -c "from harness.models import load_agent; a=load_agent('agents/examples/pi-tsec.yaml'); assert a.type == 'pi' and a.network == 'host'"
      - run: harness tsec --help
      - run: harness gateway --help
      - run: harness serve --help
      - run: harness worker --help
      - run: harness capabilities
      - run: harness run benchmarks/examples/hello/task.yaml --agent agents/examples/demo.yaml --allow-host-agent --seed 7
      - run: >-
          harness suite benchmarks/examples/smoke-suite.yaml
          --agent agents/examples/demo.yaml
          --allow-host-agent
          --workers 2
          > /tmp/smoke-suite-candidate.json
      - run: >-
          harness compare-evaluations
          benchmarks/baselines/smoke-suite.json
          /tmp/smoke-suite-candidate.json
      - run: harness validate-suite benchmarks/examples/generalization-smoke-suite.yaml
      - run: >-
          harness suite benchmarks/examples/generalization-smoke-suite.yaml
          --agent agents/examples/multidomain-demo.yaml
          --allow-host-agent
          --workers 3
          > /tmp/generalization-suite-candidate.json
      - run: >-
          harness compare-evaluations
          benchmarks/baselines/generalization-smoke-suite.json
          /tmp/generalization-suite-candidate.json
      - run: >-
          harness run benchmarks/examples/hello/task.yaml
          --agent agents/examples/gateway-demo.yaml
          --allow-host-agent
          --gateway
          --gateway-policy examples/gateway-policy.yaml
          --seed 11
      - run: docker build -t harness-gateway-demo:ci agents/examples/docker-gateway
      - run: docker build -t harness-verifier:ci benchmarks/examples/hello-docker-verifier
      - run: docker build -f docker/gateway/Dockerfile -t harness-gateway:ci .
      - run: >-
          harness run benchmarks/examples/hello/task.yaml
          --agent agents/examples/docker-gateway.yaml
          --gateway
          --gateway-policy examples/gateway-policy.yaml
          --seed 12
      - run: >-
          harness run benchmarks/examples/hello/task.yaml
          --agent agents/examples/docker-gateway.yaml
          --gateway
          --gateway-mode sidecar
          --gateway-image harness-gateway:ci
          --gateway-policy examples/gateway-policy.yaml
          --seed 14
      - run: >-
          harness run benchmarks/examples/hello-docker-verifier/task.yaml
          --agent agents/examples/demo.yaml
          --allow-host-agent
          --seed 13
      - name: distributed control plane and worker e2e
        env:
          HARNESS_CONTROL_TOKEN: ci-token
        run: |
          set -euo pipefail
          rm -rf .harness/distributed-runs
          rm -f /tmp/harness-control.db
          harness serve \
            --queue-db /tmp/harness-control.db \
            --runs-root .harness/distributed-runs \
            --benchmarks-root benchmarks \
            --host 127.0.0.1 \
            --port 8780 >/tmp/harness-control.log 2>&1 &
          control_pid=$!
          trap 'kill "$control_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import httpx

          for _ in range(100):
              try:
                  if httpx.get("http://127.0.0.1:8780/health", timeout=0.5).status_code == 200:
                      break
              except Exception:
                  pass
              time.sleep(0.1)
          else:
              raise SystemExit("control plane failed to start")
          PY
          harness submit benchmarks/examples/hello/task.yaml \
            --agent agents/examples/demo.yaml \
            --control-url http://127.0.0.1:8780 \
            --runs-root .harness/distributed-runs \
            --allow-host-agent \
            --seed 21 >/tmp/submitted-job.json
          harness worker \
            --control-url http://127.0.0.1:8780 \
            --workspace-root . \
            --allow-host-jobs \
            --once
          python - <<'PY'
          import httpx

          headers = {"Authorization": "Bearer ci-token"}
          jobs = httpx.get(
              "http://127.0.0.1:8780/v1/jobs", headers=headers, timeout=5
          ).json()
          assert len(jobs) == 1, jobs
          assert jobs[0]["state"] == "completed", jobs[0]
          assert jobs[0]["result"]["success"] is True, jobs[0]
          board = httpx.get(
              "http://127.0.0.1:8780/v1/leaderboard", headers=headers, timeout=5
          ).json()
          assert board[0]["success_rate"] == 1.0, board
          assert board[0]["mean_score"] == 100.0, board
          run_id = jobs[0]["result"]["run_id"]
          trace = httpx.get(
              f"http://127.0.0.1:8780/v1/runs/{run_id}/trace",
              headers=headers,
              timeout=5,
          ).json()
          assert trace, trace
          otel = httpx.get(
              f"http://127.0.0.1:8780/v1/runs/{run_id}/otel",
              headers=headers,
              timeout=5,
          ).json()
          assert otel["resourceSpans"], otel
          PY
