apiVersion: harness/v1
id: demo-agent
type: cli
command:
  - python
  - -c
  - |
    import os
    from pathlib import Path
    from harness.telemetry import model_usage, tool_call
    tool_call(tool="file.write")
    model_usage(input_tokens=7, output_tokens=5, cost_usd=0.01, model="demo")
    Path(os.environ["HARNESS_RUN_DIR"], "proof.txt").write_text("red-harness-ok\n")
